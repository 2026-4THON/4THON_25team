
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: none

spring:
  datasource:
    url: jdbc:mysql:///danglog?cloudSqlInstance=danglog:asia-northeast3:danglog-mysql&socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlRefreshStrategy=lazy
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  frontend-url: ${FRONTEND_URL}
