
name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$PROJECT_ID" || { echo "Missing PROJECT_ID"; exit 1; }
          test -n "$REGION" || { echo "Missing REGION"; exit 1; }
          test -n "$GAR_REPOSITORY" || { echo "Missing GAR_REPOSITORY"; exit 1; }
          test -n "$CLOUD_RUN_SERVICE" || { echo "Missing CLOUD_RUN_SERVICE"; exit 1; }

      - name: Authenticate Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        shell: bash
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"

          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}

          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            DB_USERNAME=danglog_app
            FRONTEND_URL=https://danglog-backend-40913066893.asia-northeast3.run.app

          env_vars_update_strategy: merge

          secrets: |
            DB_PASSWORD=DB_PASSWORD:latest
            GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
            ADMIN_API_KEY=ADMIN_API_KEY:latest
            KOPIS_API_KEY=KOPIS_API_KEY:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            YOUTUBE_API_KEY=YOUTUBE_API_KEY:latest

          secrets_update_strategy: merge



          flags: >-
            --service-account=40913066893-compute@developer.gserviceaccount.com
            --memory=1Gi
            --scaling=auto
            --min-instances=1
            --max-instances=2
            --allow-unauthenticated
            --no-cpu-throttling
      
      

      - name: Print Service URL
        run: echo "${{ steps.deploy.outputs.url }}"
